# language: toml, file: nixpacks.toml
[phases.setup]
nixPkgs = ["python3.11", "python3.11Packages.pip", "chromium"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "python -m pip install -r requirements.txt",
  "python -m playwright install chromium"
]

[start]
cmd = "python bot.py"
