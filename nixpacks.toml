[phases.setup]
# Keep Python packages selected by the Nixpacks Python provider and add Chromium.
nixPkgs = ["...", "chromium"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "python -m pip install -r requirements.txt",
  "python -m playwright install chromium"
]

[start]
cmd = "python bot.py"
